<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b72706" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="Create private, standards-friendly vCard and calendar event QR codes in your browser. Download PNG, SVG, VCF, and ICS files for free." />

    <title>Free vCard & Event QR Code Generator</title>
    <link rel="canonical" href="https://mralexgarrido.github.io/vCard-Generator/" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Free vCard & Event QR Code Generator" />
    <meta property="og:description" content="Create contact and calendar QR codes privately in your browser. No account, tracking, or data upload." />
    <meta property="og:url" content="https://mralexgarrido.github.io/vCard-Generator/" />
    <meta property="og:image" content="https://mralexgarrido.github.io/vCard-Generator/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="vCard QR contact and event generator" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Free vCard & Event QR Code Generator" />
    <meta name="twitter:description" content="Create contact and calendar QR codes privately in your browser." />
    <meta name="twitter:image" content="https://mralexgarrido.github.io/vCard-Generator/social-card.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "vCard & Event QR Code Generator",
        "url": "https://mralexgarrido.github.io/vCard-Generator/",
        "description": "A free, private, browser-based generator for vCard contact QR codes and iCalendar event QR codes.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires a modern web browser with JavaScript enabled.",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "vCard 3.0 contact QR codes",
          "iCalendar 2.0 event QR codes",
          "PNG and SVG QR downloads",
          "VCF and ICS file downloads",
          "Local VCF and ICS file import",
          "QR color and export-size controls",
          "Calendar reminders and quick event durations",
          "Local browser processing"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Does this tool upload my contact or event information?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. The browser creates the QR code and downloadable files locally. The app has no account system, analytics, database, or server-side processing."
            }
          },
          {
            "@type": "Question",
            "name": "What is the difference between VCF and ICS?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A VCF file stores contact information. An ICS file stores a calendar event. The QR code contains the same underlying data."
            }
          },
          {
            "@type": "Question",
            "name": "Which QR format should I download?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "PNG works well for presentations, email, and social media. SVG stays sharp at any size and is better for professionally printed materials."
            }
          },
          {
            "@type": "Question",
            "name": "Can I edit an existing contact or calendar file?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Import a VCF or ICS file and the generator will load commonly used contact and event fields locally in the browser. The file is never uploaded."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This generator needs JavaScript to create QR codes locally in your browser.</noscript>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
